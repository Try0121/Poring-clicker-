<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Poring Clicker"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>Poring Clicker — V2</title><style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--text:#f8fafc;--muted:#94a3b8;--pink:#f472b6;--gold:#fbbf24;--line:#334155;--good:#34d399;--purple:#c084fc}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;padding-bottom:calc(82px + env(safe-area-inset-bottom));overscroll-behavior-y:none}header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;text-align:center}h1{margin:0;font-size:1.3rem}.sub{color:var(--muted);font-size:.82rem;margin-top:4px}main{max-width:760px;margin:auto;padding:0 12px}.page{display:none}.page.active{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}.stat{text-align:center}.stat b{display:block;color:var(--gold);font-size:1.06rem;margin-top:4px}.stat span,.small{font-size:.75rem;color:var(--muted)}.poring-zone{min-height:48vh;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.poring{width:180px;height:148px;border-radius:52% 52% 48% 48% / 58% 58% 42% 42%;background:var(--pink);position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:inset 0 -12px 0 #0001,0 12px 30px #0005;transition:transform .07s}.poring:active{transform:scale(.91)}.poring:before,.poring:after{content:"";position:absolute;top:55px;width:14px;height:20px;border-radius:50%;background:#111827}.poring:before{left:50px}.poring:after{right:50px}.mouth{position:absolute;left:50%;top:87px;width:42px;height:18px;transform:translateX(-50%);border-bottom:4px solid #111827;border-radius:0 0 50% 50%}.shine{position:absolute;left:40px;top:29px;width:36px;height:18px;background:#fff5;border-radius:50%;transform:rotate(-20deg)}.crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:36px;display:none}.tap-label{text-align:center;color:var(--muted);font-size:.9rem;margin-top:12px}.float{position:fixed;pointer-events:none;font-weight:900;color:var(--gold);z-index:999;animation:float .72s ease-out forwards}@keyframes float{to{opacity:0;transform:translateY(-66px) scale(1.25)}}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary .card{text-align:center}.summary b{display:block;color:var(--good);margin-top:3px}.section-title{font-size:1rem;margin:15px 2px 8px}.shop{display:grid;gap:9px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.item-name{font-weight:800}.item-desc{font-size:.79rem;color:var(--muted);margin-top:3px}.item-meta{font-size:.76rem;color:var(--good);margin-top:5px}.milestone{font-size:.75rem;color:#e9d5ff;margin-top:6px}.progress{height:7px;background:#263244;border-radius:999px;overflow:hidden;margin-top:6px}.progress span{display:block;height:100%;background:var(--purple)}.buy{border:0;border-radius:14px;padding:10px 12px;background:var(--gold);color:#111827;font-weight:900;min-width:105px}.buy:disabled{opacity:.35}.prestige{background:linear-gradient(135deg,#2a1530,#19172b)}.prestige button{width:100%;border:0;border-radius:14px;padding:12px;background:var(--purple);color:#1f1230;font-weight:900;margin-top:10px}.prestige button:disabled{opacity:.35}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:10px;font-weight:700}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#0f172af5;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:14px;padding:11px;font-weight:850}.tab.active{background:var(--gold);color:#111827;border-color:var(--gold)}.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:1200;white-space:nowrap}.toast.show{opacity:1}@media(min-width:680px){.shop{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>Poring Clicker</h1><div class="sub">Prototype privé — V2</div></header><main>
<section id="pagePoring" class="page active"><section class="stats"><div class="card stat"><span>Zeny</span><b id="zeny">0</b></div><div class="card stat"><span>Par clic</span><b id="perClick">1</b></div><div class="card stat"><span>Par seconde</span><b id="perSec">0</b></div></section><div id="poringZone" class="poring-zone"><div id="poring" class="poring"><div class="shine"></div><div class="mouth"></div><div id="crown" class="crown">👑</div></div><div id="formLabel" class="tap-label">Poring</div><div class="tap-label">Touche-le pour gagner des Zeny</div></div><section class="summary"><div class="card"><span class="small">Classes possédées</span><b id="units">0</b></div><div class="card"><span class="small">Prestiges</span><b id="prestiges">0</b></div></section><h2 class="section-title">Prestige</h2><section class="card prestige"><div class="row"><div><div class="item-name">Évolution du Poring</div><div class="item-desc">Recommence presque à zéro contre un bonus permanent.</div></div><div id="prestigeInfo" class="small"></div></div><button id="prestigeBtn">Prestige indisponible</button></section><section class="actions"><button id="saveBtn" class="secondary">Sauvegarder</button><button id="resetBtn" class="secondary">Réinitialiser</button></section></section>
<section id="pageClasses" class="page"><section class="stats"><div class="card stat"><span>Zeny</span><b id="zeny2">0</b></div><div class="card stat"><span>Production</span><b id="perSec2">0</b></div><div class="card stat"><span>Unités</span><b id="units2">0</b></div></section><h2 class="section-title">Classes / professions</h2><section id="shop" class="shop"></section></section>
</main><nav class="tabs"><button class="tab active" data-page="pagePoring">🟣 Poring</button><button class="tab" data-page="pageClasses">⚔️ Classes</button></nav><div id="toast" class="toast"></div><script>
const professions=[{id:'novice',name:'Novice',baseCost:15,baseIncome:.2,desc:'Tes premiers aventuriers.'},{id:'swordsman',name:'Swordman',baseCost:100,baseIncome:1.2,desc:'Des combattants réguliers.'},{id:'archer',name:'Archer',baseCost:500,baseIncome:6,desc:'Production stable à distance.'},{id:'mage',name:'Mage',baseCost:2500,baseIncome:28,desc:'Cher, mais très rentable.'},{id:'acolyte',name:'Acolyte',baseCost:12000,baseIncome:120,desc:'Bénit ton économie.'},{id:'merchant',name:'Merchant',baseCost:60000,baseIncome:520,desc:'Le spécialiste du Zeny.'},{id:'thief',name:'Thief',baseCost:300000,baseIncome:2200,desc:'Rapide et très rentable.'}];
const forms=[{name:'Poring',mult:1,color:'#f472b6'},{name:'Drops',mult:1.5,color:'#f9a8d4'},{name:'Poporing',mult:2.25,color:'#65a30d'},{name:'Marin',mult:3.5,color:'#38bdf8'},{name:'Angeling',mult:5.5,color:'#f8fafc'},{name:'Deviling',mult:8.5,color:'#7c3aed'},{name:'Ghostring',mult:13,color:'#cbd5e1'}];
const milestones=[{count:25,mult:2},{count:50,mult:3},{count:100,mult:5},{count:250,mult:8},{count:500,mult:12}];
const def={zeny:0,totalEarned:0,clicks:0,prestige:0,professionCounts:{},lastSave:Date.now()};let state=load();
function clone(){return JSON.parse(JSON.stringify(def))}function load(){try{let x=localStorage.getItem('poringClickerV1');if(!x)return clone();let s={...clone(),...JSON.parse(x)};s.professionCounts=s.professionCounts||{};return s}catch{return clone()}}function save(show=false){state.lastSave=Date.now();localStorage.setItem('poringClickerV1',JSON.stringify(state));if(show)toast('Sauvegarde effectuée')}
function pMult(){return forms[Math.min(state.prestige,forms.length-1)].mult}function mMult(c){let m=1;for(const x of milestones)if(c>=x.count)m=x.mult;return m}function nextM(c){return milestones.find(x=>c<x.count)||null}function clickValue(){return Math.max(1,Math.floor(pMult()*(1+state.prestige*.5)))}function cost(p){let c=state.professionCounts[p.id]||0;return Math.floor(p.baseCost*Math.pow(1.15,c))}function incomeP(p){let c=state.professionCounts[p.id]||0;return c*p.baseIncome*mMult(c)*pMult()}function ips(){return professions.reduce((a,p)=>a+incomeP(p),0)}function units(){return Object.values(state.professionCounts).reduce((a,b)=>a+(+b||0),0)}function fmt(n){if(n<1000)return Math.floor(n).toLocaleString('fr-FR');const u=['k','M','Md','B','T'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+u[i]}
function renderShop(){let s=document.getElementById('shop');s.innerHTML='';professions.forEach(p=>{let c=state.professionCounts[p.id]||0,co=cost(p),mm=mMult(c),nm=nextM(c);let prev=[0,...milestones.map(x=>x.count)].filter(x=>x<=c).pop()||0;let pct=nm?Math.max(0,Math.min(100,(c-prev)/(nm.count-prev)*100)):100;let el=document.createElement('div');el.className='card item';el.innerHTML=`<div><div class="item-name">${p.name} × ${c}</div><div class="item-desc">${p.desc}</div><div class="item-meta">Production totale : ${fmt(incomeP(p))} Zeny/s</div><div class="milestone">Bonus actuel ×${mm}${nm?` · prochain : ${nm.count} → ×${nm.mult}`:' · palier maximum'}</div><div class="progress"><span style="width:${pct}%"></span></div></div><button class="buy" ${state.zeny<co?'disabled':''}>${fmt(co)} Z</button>`;el.querySelector('button').onclick=()=>{if(state.zeny<co)return;state.zeny-=co;state.professionCounts[p.id]=c+1;let hit=milestones.find(x=>x.count===c+1);if(hit)toast(`${p.name} : palier ${hit.count} atteint ! ×${hit.mult}`);render()};s.appendChild(el)})}
function req(){return 1e6*Math.pow(8,state.prestige)}function renderPrestige(){let r=req(),b=document.getElementById('prestigeBtn'),next=forms[Math.min(state.prestige+1,forms.length-1)],can=state.totalEarned>=r&&state.prestige<forms.length-1;document.getElementById('prestigeInfo').textContent=`${fmt(state.totalEarned)} / ${fmt(r)} Z`;b.disabled=!can;b.textContent=state.prestige>=forms.length-1?'Dernière forme atteinte':can?`Évoluer en ${next.name}`:`Prestige à ${fmt(r)} Z gagnés`}
function render(){let z=fmt(state.zeny),p=fmt(ips()),u=fmt(units());zeny.textContent=z;zeny2.textContent=z;perClick.textContent=fmt(clickValue());perSec.textContent=p;perSec2.textContent=p;units.textContent=u;units2.textContent=u;prestiges.textContent=state.prestige;let f=forms[Math.min(state.prestige,forms.length-1)];formLabel.textContent=`${f.name} — bonus global ×${f.mult}`;poring.style.background=f.color;crown.style.display=state.prestige>=4?'block':'none';renderShop();renderPrestige()}
poring.addEventListener('pointerdown',e=>{e.preventDefault();let v=clickValue();state.zeny+=v;state.totalEarned+=v;state.clicks++;let f=document.createElement('div');f.className='float';f.textContent='+'+fmt(v);f.style.left=e.clientX-12+'px';f.style.top=e.clientY-10+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),720);render()});poringZone.addEventListener('touchmove',e=>{if(e.target.closest('#poring'))e.preventDefault()},{passive:false});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})});prestigeBtn.onclick=()=>{let r=req();if(state.totalEarned<r||state.prestige>=forms.length-1)return;state.prestige++;state.zeny=0;state.totalEarned=0;state.professionCounts={};save();toast('Prestige ! Nouvelle forme débloquée');render()};saveBtn.onclick=()=>save(true);resetBtn.onclick=()=>{if(confirm('Effacer toute la progression ?')){localStorage.removeItem('poringClickerV1');state=clone();render();toast('Progression réinitialisée')}};function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}function offline(){let now=Date.now(),sec=Math.min((now-state.lastSave)/1000,8*3600),g=ips()*sec;if(g>1){state.zeny+=g;state.totalEarned+=g;toast(`Gain hors-ligne : +${fmt(g)} Zeny`)}state.lastSave=now}offline();render();setInterval(()=>{let g=ips()/10;state.zeny+=g;state.totalEarned+=g;render()},100);setInterval(()=>save(false),10000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script></body></html>
